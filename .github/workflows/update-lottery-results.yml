name: Update Kerala Lottery Results

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install requests beautifulsoup4 pypdf

      - name: Update results
        run: python update_results.py

      - name: Save updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json latest_result.json
          git diff --cached --quiet || git commit -m "Update Kerala lottery result"
          git push
