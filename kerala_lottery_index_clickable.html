<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerala Lottery Guessing & Result</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075b3f">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;font-family:Arial,sans-serif;color:#172033;padding-bottom:78px}
.header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#075b3f,#0b8a5a);color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0002}
.hr{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:cover}
.brand{font-size:19px;font-weight:800}.sub{font-size:11px;opacity:.85}.menu{margin-left:auto;font-size:25px}
.wrap{max-width:700px;margin:auto;padding:14px}.hero,.panel{background:#fff;border-radius:17px;padding:15px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
.hero b{font-size:18px}.hero p{margin:5px 0 0;color:#687385;font-size:13px}.title{font-size:18px;font-weight:800;margin:16px 3px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;padding:0;width:100%;text-align:left;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0002;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.98)}.top{height:112px;padding:14px 12px;background:linear-gradient(135deg,#0757a8,#1b62c1);color:#fff;position:relative}
.bumper .top{background:linear-gradient(135deg,#ef4d52,#ff666b)}.badge{position:absolute;right:8px;top:8px;background:#7188e8;border-radius:12px;padding:6px 9px;font-size:12px;font-weight:700}
.new{position:absolute;left:-27px;top:10px;background:#ef3e43;padding:5px 28px;font-size:10px;font-weight:800;transform:rotate(-35deg)}
.name{font-size:17px;margin-top:35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{background:#fff;text-align:center;padding:11px 5px;font-size:14px;font-weight:700}
.panel{display:none}.panel h2{margin:0 0 10px}.panel p{font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid #d9dee6;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0001}
.nav{border:0;background:none;color:#667085;font-size:11px}.nav.active{color:#075b3f;font-weight:800}.ico{display:block;font-size:23px;line-height:24px}
input,select{width:100%;padding:13px;border:1px solid #d7dde6;border-radius:10px;font-size:15px;margin:5px 0 10px}
.action{width:100%;padding:13px;border:0;border-radius:11px;background:#075b3f;color:#fff;font-weight:800;font-size:15px}
.result{margin-top:12px;line-height:1.6;font-size:14px}.back{margin-bottom:10px}.prize{padding:10px 0;border-bottom:1px solid #e5e7eb}
@media(max-width:380px){.grid{gap:8px}.name{font-size:15px}}
</style>
</head>
<body>
<header class="header"><div class="hr">
<img class="logo" src="kerala-lottery-icon-512.png">
<div><div class="brand">KERALA LOTTERY</div><div class="sub">GUESSING & RESULT</div></div>
<div class="menu">☰</div>
</div></header>

<main class="wrap">
<div class="hero"><b>Latest Lottery Results</b><p>2026 results • Search • Number analysis</p></div>

<div id="home">
<div class="title">Latest Draws</div>
<div class="grid" id="drawGrid"></div>
</div>

<section id="drawDetail" class="panel">
<button class="action back" onclick="showTab('home')">← Back to Latest Draws</button>
<h2 id="detailTitle"></h2>
<div class="result" id="detailResult"></div>
</section>

<section id="searchPanel" class="panel"><h2>Search Ticket</h2>
<input id="ticket" inputmode="numeric" placeholder="Enter 6 digit ticket number">
<button class="action" onclick="searchTicket()">Search</button>
<div class="result" id="ticketResult"></div></section>

<section id="scanPanel" class="panel"><h2>Scan Ticket</h2>
<p>Camera scanner can be connected in the next update.</p>
<button class="action" onclick="alert('Scanner feature will be added next.')">Open Scanner</button></section>

<section id="hotPanel" class="panel"><h2>Hot Picks</h2>
<p>Sample numbers only — not a prediction or guarantee.</p>
<button class="action" onclick="generateNumbers()">Generate Numbers</button>
<div class="result" id="guessResult"></div></section>

<section id="archivePanel" class="panel"><h2>2020–2026 Results</h2>
<select id="year"><option value="2026" selected>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option></select>
<button class="action" onclick="viewResults()">View Results</button>
<div class="result" id="archiveResult"></div></section>
</main>

<nav class="bottom">
<button class="nav active" id="navHome" onclick="showTab('home')"><span class="ico">⌂</span>Home</button>
<button class="nav" id="navSearch" onclick="showTab('searchPanel')"><span class="ico">⌕</span>Search</button>
<button class="nav" id="navScan" onclick="showTab('scanPanel')"><span class="ico">▣</span>Scan</button>
<button class="nav" id="navHot" onclick="showTab('hotPanel')"><span class="ico">💡</span>Hot Picks</button>
</nav>

<script>
const draws=[
['STHREE SAKTHI','SS-539','29/09/2026',1,0],
['BHAGYATHARA','BT-73','28/09/2026',0,0],
['SAMRUDHI','SM-74','27/09/2026',0,0],
['THIRUVONAM BUMPER','BR-111','26/09/2026',0,1],
['SUVARNA KERALAM','SK-71','25/09/2026',0,0],
['KARUNYA PLUS','KN-642','24/09/2026',0,0],
['DHANALEKSHMI','DL-70','23/09/2026',0,0],
['STHREE SAKTHI','SS-538','22/09/2026',0,0],
['BHAGYATHARA','BT-72','21/09/2026',0,0],
['SAMRUDHI','SM-73','20/09/2026',0,0]
];

const grid=document.getElementById('drawGrid');
const home=document.getElementById('home');

function renderDraws(){
  grid.innerHTML=draws.map((d,i)=>`
    <button class="card ${d[4]?'bumper':''}" onclick="openDraw(${i})" aria-label="Open ${d[0]} ${d[1]} result">
      <div class="top">${d[3]?'<span class="new">NEW</span>':''}
        <span class="badge">${d[1]}</span>
        <div class="name">${d[0]}</div>
      </div>
      <div class="date">${d[2]}</div>
    </button>`).join('');
}

async function openDraw(i){
  const d=draws[i];
  document.getElementById('detailTitle').textContent=d[0]+' '+d[1];
  const detail=document.getElementById('detailResult');
  detail.innerHTML='<b>Draw Date:</b> '+d[2]+'<br><br>Loading result details...';
  showTab('drawDetail');

  try{
    const r=await fetch('results.json',{cache:'no-store'});
    const data=await r.json();
    const found=(data.results||[]).find(x=>
      String(x.code||'').toUpperCase()===d[1].split('-')[0].toUpperCase() &&
      String(x.draw_no||'')===d[1].split('-')[1]
    );
    if(found){
      let h='<b>Draw Date:</b> '+found.draw_date+'<br><br>';
      for(const [p,v] of Object.entries(found.prizes||{})){
        h+='<div class="prize"><b>'+p.toUpperCase()+'</b> — ₹'+Number(v.amount||0).toLocaleString('en-IN')+'<br>'+((v.numbers||[]).join(', '))+'</div>';
      }
      detail.innerHTML=h;
    }else{
      detail.innerHTML='<b>Draw Date:</b> '+d[2]+'<br><br><b>Detailed result is not yet stored in this app.</b><br><br><button class="action" onclick="window.open(\\'https://result.keralalotteries.com/\\',\\'_blank\\')">Open Official Kerala Lottery Result</button>';
    }
  }catch(e){
    detail.innerHTML='<b>Draw Date:</b> '+d[2]+'<br><br>Result database could not be loaded.<br><br><button class="action" onclick="window.open(\\'https://result.keralalotteries.com/\\',\\'_blank\\')">Open Official Kerala Lottery Result</button>';
  }
}

function showTab(id){
  document.querySelectorAll('.panel').forEach(x=>x.style.display='none');
  home.style.display=(id==='home')?'block':'none';
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  if(id==='home') document.getElementById('navHome').classList.add('active');
  else if(id==='drawDetail') document.getElementById('drawDetail').style.display='block';
  else{
    document.getElementById(id).style.display='block';
    const map={searchPanel:'navSearch',scanPanel:'navScan',hotPanel:'navHot',archivePanel:null};
    if(map[id]) document.getElementById(map[id]).classList.add('active');
  }
  scrollTo({top:0,behavior:'smooth'});
}

function generateNumbers(){
  let a=[];
  while(a.length<5){
    let n=Math.floor(Math.random()*1000000).toString().padStart(6,'0');
    if(!a.includes(n)) a.push(n);
  }
  document.getElementById('guessResult').innerHTML='<b>Sample Analysis Numbers</b><br>'+a.join(' • ');
}

function searchTicket(){
  let t=document.getElementById('ticket').value.trim();
  document.getElementById('ticketResult').innerHTML=t?
  '<b>Ticket:</b> '+t+'<br><br>Automatic verification is not connected yet. Please verify with the official Kerala State Lotteries result site.':
  'Please enter a ticket number.';
}

async function viewResults(){
  let y=document.getElementById('year').value;
  const out=document.getElementById('archiveResult');
  try{
    let r=await fetch('results.json',{cache:'no-store'}),d=await r.json();
    let rs=(d.results||[]).filter(x=>String(x.draw_date||'').endsWith(y));
    if(!rs.length){out.innerHTML='ഈ വർഷത്തെ data ഇപ്പോൾ ചേർത്തിട്ടില്ല.';return}
    let h='<h3>'+y+' Results</h3>';
    rs.forEach(x=>{
      h+='<hr><b>'+x.lottery+' '+x.code+'-'+x.draw_no+'</b><br>Draw Date: '+x.draw_date+'<br><br>';
      for(const[p,i]of Object.entries(x.prizes||{}))
        h+='<b>'+p.toUpperCase()+'</b> — ₹'+Number(i.amount||0).toLocaleString('en-IN')+'<br>'+((i.numbers||[]).join(', '))+'<br><br>';
    });
    out.innerHTML=h;
  }catch(e){out.innerHTML='Results database load ചെയ്യാൻ കഴിഞ്ഞില്ല.'}
}

renderDraws();
</script>
</body>
</html>
