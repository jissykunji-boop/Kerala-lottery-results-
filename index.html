<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerala Lottery Guessing & Result</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075b3f">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#eef3f8;
 font-family:Arial,sans-serif;
 color:#172033;
 padding-bottom:78px
}

.header{
 position:sticky;
 top:0;
 z-index:20;
 background:linear-gradient(135deg,#075b3f,#0b8a5a);
 color:#fff;
 padding:14px 16px;
 box-shadow:0 2px 8px #0002
}

.hr{display:flex;align-items:center;gap:11px}

.logo{
 width:44px;
 height:44px;
 border-radius:12px;
 background:#fff;
 object-fit:cover
}

.brand{font-size:19px;font-weight:800}
.sub{font-size:11px;opacity:.85}
.menu{margin-left:auto;font-size:25px}

.wrap{
 max-width:700px;
 margin:auto;
 padding:14px
}

.hero,.panel{
 background:#fff;
 border-radius:17px;
 padding:15px;
 box-shadow:0 2px 10px #0001;
 margin-bottom:14px
}

.hero b{font-size:18px}
.hero p{
 margin:5px 0 0;
 color:#687385;
 font-size:13px
}

.title{
 font-size:18px;
 font-weight:800;
 margin:16px 3px 10px
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.card{
 border:0;
 padding:0;
 width:100%;
 text-align:left;
 background:#fff;
 border-radius:16px;
 overflow:hidden;
 box-shadow:0 2px 8px #0002;
 cursor:pointer
}

.card:active{transform:scale(.98)}

.top{
 height:112px;
 padding:14px 12px;
 background:linear-gradient(135deg,#0757a8,#1b62c1);
 color:#fff;
 position:relative
}

.bumper .top{
 background:linear-gradient(135deg,#ef4d52,#ff666b)
}

.badge{
 position:absolute;
 right:8px;
 top:8px;
 background:#7188e8;
 border-radius:12px;
 padding:6px 9px;
 font-size:12px;
 font-weight:700
}

.new{
 position:absolute;
 left:-27px;
 top:10px;
 background:#ef3e43;
 padding:5px 28px;
 font-size:10px;
 font-weight:800;
 transform:rotate(-35deg)
}

.name{
 font-size:17px;
 margin-top:35px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.date{
 background:#fff;
 text-align:center;
 padding:11px 5px;
 font-size:14px;
 font-weight:700
}

/* RESULT PAGE */

#drawDetail{
 display:none;
 padding:12px
}

.detailTop{
 display:flex;
 align-items:center;
 gap:8px;
 margin-bottom:12px
}

.backBtn,.shareBtn{
 border:0;
 background:#edf4f1;
 color:#075b3f;
 border-radius:10px;
 padding:9px 12px;
 font-weight:800;
 font-size:14px
}

.shareBtn{
 margin-left:auto
}

.drawHeader{
 background:linear-gradient(135deg,#075b3f,#0b8a5a);
 color:white;
 border-radius:14px;
 padding:16px;
 text-align:center;
 margin-bottom:14px
}

.drawHeader h2{
 margin:0;
 font-size:21px
}

.drawHeader .drawNo{
 margin-top:5px;
 font-size:14px;
 opacity:.9
}

.drawHeader .drawDate{
 margin-top:3px;
 font-size:13px;
 opacity:.85
}

.prizeBox{
 background:#fff;
 border:1px solid #dfe5e9;
 border-radius:14px;
 margin:11px 0;
 overflow:hidden;
 box-shadow:0 1px 5px #0001
}

.prizeTitle{
 background:#f0f4f6;
 padding:11px 13px;
 font-weight:800;
 font-size:16px
}

.prizeBody{
 padding:13px
}

.prizeAmount{
 font-size:19px;
 font-weight:800;
 color:#075b3f;
 margin-bottom:8px
}

.place{
 color:#667085;
 font-size:14px;
 margin-bottom:9px
}

.numberGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px
}

.number{
 background:#f7f9fb;
 border:1px solid #dfe5e9;
 border-radius:8px;
 padding:9px 5px;
 text-align:center;
 font-weight:700;
 font-size:14px
}

.firstPrize{
 background:#fff;
 border:2px solid #075b3f
}

.firstPrize .prizeTitle{
 background:#075b3f;
 color:white
}

.emptyResult{
 text-align:center;
 background:#f8fafb;
 border-radius:13px;
 padding:20px;
 color:#667085
}

.official{
 margin-top:12px;
 background:#075b3f
}

/* OTHER */

.panel{display:none}

.panel h2{
 margin:0 0 10px
}

.panel p{
 font-size:14px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 background:#fff;
 border-top:1px solid #d9dee6;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 padding:7px 4px calc(7px + env(safe-area-inset-bottom));
 box-shadow:0 -2px 10px #0001
}

.nav{
 border:0;
 background:none;
 color:#667085;
 font-size:11px
}

.nav.active{
 color:#075b3f;
 font-weight:800
}

.ico{
 display:block;
 font-size:23px;
 line-height:24px
}

input,select{
 width:100%;
 padding:13px;
 border:1px solid #d7dde6;
 border-radius:10px;
 font-size:15px;
 margin:5px 0 10px
}

.action{
 width:100%;
 padding:13px;
 border:0;
 border-radius:11px;
 background:#075b3f;
 color:#fff;
 font-weight:800;
 font-size:15px
}

.result{
 margin-top:12px;
 line-height:1.6;
 font-size:14px
}

@media(max-width:380px){
 .grid{gap:8px}
 .name{font-size:15px}
 .numberGrid{grid-template-columns:1fr}
}
</style>
</head>

View Results
</button>

<div class="result" id="archiveResult"></div>

</section>

</main>


<nav class="bottom">

<button class="nav active"
id="navHome"
onclick="showTab('home')">

<span class="ico">⌂</span>
Home

</button>

<button class="nav"
id="navSearch"
onclick="showTab('searchPanel')">

<span class="ico">⌕</span>
Search

</button>

<button class="nav"
id="navScan"
onclick="showTab('scanPanel')">

<span class="ico">▣</span>
Scan

</button>

<button class="nav"
id="navHot"
onclick="showTab('hotPanel')">

<span class="ico">💡</span>
Hot Picks

</button>

</nav>

function normalizeData(raw){

if(Array.isArray(raw)) return raw;

if(Array.isArray(raw.results)) return raw.results;

return [];

}


function esc(v){

return String(v??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


function prizeRank(key){

const s=String(key).toLowerCase();

const m=s.match(/(\d+)/);

if(m) return Number(m[1]);

if(s.includes('first'))return 1;
if(s.includes('second'))return 2;
if(s.includes('third'))return 3;
if(s.includes('fourth'))return 4;
if(s.includes('fifth'))return 5;
if(s.includes('sixth'))return 6;
if(s.includes('seventh'))return 7;
if(s.includes('eighth'))return 8;

return 99;

}


function prizeLabel(key){

const s=String(key).toLowerCase();

const m=s.match(/(\d+)/);

if(m){

const n=Number(m[1]);

const suffix=
n===1?'st':
n===2?'nd':
n===3?'rd':'th';

return n+suffix+' Prize';

}

if(s.includes('first'))return '1st Prize';
if(s.includes('second'))return '2nd Prize';
if(s.includes('third'))return '3rd Prize';
if(s.includes('fourth'))return '4th Prize';
if(s.includes('fifth'))return '5th Prize';
if(s.includes('sixth'))return '6th Prize';
if(s.includes('seventh'))return '7th Prize';
if(s.includes('eighth'))return '8th Prize';

return String(key);

}


function renderPrize(key,v){

if(!v)return '';

const amount=v.amount ?? v.prize ?? '';

const place=v.place ?? v.location ?? '';

const nums=
Array.isArray(v.numbers)
?v.numbers
:(v.number?[v.number]:[]);

const first=prizeRank(key)===1;

return `

<div class="prizeBox ${first?'firstPrize':''}">

<div class="prizeTitle">
${esc(prizeLabel(key))}
</div>

<div class="prizeBody">

${amount!==''?
`<div class="prizeAmount">
₹${Number(amount).toLocaleString('en-IN')}
</div>`:''}

${place?
`<div class="place">
📍 ${esc(place)}
</div>`:''}

${nums.length?
`<div class="numberGrid">

${nums.map(n=>`

<div class="number">
${esc(n)}
</div>

`).join('')}

</div>`:''}

</div>

</div>

`;

}
